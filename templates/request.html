{% extends "layout.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #43cea2, #185a9d);
        min-height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 450px;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: #43cea2;
        box-shadow: 0 0 6px rgba(67,206,162,0.5);
    }

    label {
        font-size: 14px;
        color: #444;
        margin-top: 5px;
        display: block;
    }

    .btn {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        background: linear-gradient(135deg, #ff512f, #dd2476);
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        opacity: 0.9;
    }

    p {
        text-align: center;
        font-size: 14px;
    }
</style>

<div class="container">
    <h2>Post a Blood Request</h2>

    {% with messages = get_flashed_messages() %}
      {% for msg in messages %}
        <p style="color:red;">{{ msg }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">

        <!-- NAME -->
        <input type="text" name="patient_name"
               placeholder="Patient Name"
               pattern="[A-Za-z\s]{3,}"
               title="Only letters allowed"
               required>

        <!-- BLOOD GROUP -->
        <select name="blood_group" required>
            <option value="">Blood Group Needed</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
        </select>

        <!-- ADDRESS -->
        <input type="text" name="location"
               placeholder="Flat/House No, Area, City, Pincode"
               pattern="^[A-Za-z0-9\s,.-]*\d{1,5}.*[A-Za-z]+.*\d{6}$"
               title="Example: Flat 12, MG Road, Pune 411001"
               required>

        <!-- CONTACT -->
        <input type="text" name="contact"
               placeholder="Contact Number"
               pattern="[0-9]{10}"
               required>

        <label>Date Needed:</label>
        <input type="date" name="needed_date" required>

        <button type="submit" class="btn">Post Request</button>
    </form>
</div>

{% endblock %}
