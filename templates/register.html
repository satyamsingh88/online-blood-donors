{% extends "layout.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
        min-height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 450px;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.95);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #ff758c;
        box-shadow: 0 0 6px rgba(255,117,140,0.5);
    }

    textarea {
        resize: none;
    }

    .btn {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: linear-gradient(135deg, #36d1dc, #5b86e5);
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        opacity: 0.9;
    }

    p {
        text-align: center;
        font-size: 14px;
    }
</style>

<div class="container">
    <h2>Donor Registration</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <p style="color:red;">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
        <input type="text" name="name" placeholder="name" required>
        <input type="number" name="age" placeholder="Age" required>

        <select name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <select name="blood_group" required>
            <option value="">Select Blood Group</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
        </select>

        <input type="text" name="phone" placeholder="no" required>

        <input type="email" name="email" placeholder="email"
        required
        pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
        title="Enter valid email like abc@gmail.com">

        <textarea name="address" placeholder="address" rows="3" required></textarea>

        <button type="submit" class="btn">Submit Donor Info</button>
    </form>
</div>

{% endblock %}
